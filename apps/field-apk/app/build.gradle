plugins {
    id "com.android.application"
}

android {
    namespace "com.felipeitprojects.operationhubfield"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.felipeitprojects.operationhubfield"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "OPERATIONHUB_API_URL", "\"${System.getenv("OPERATIONHUB_API_URL") ?: "https://example.invalid"}\""
    }
}
