services:
  npm-db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${NPM_MYSQL_ROOT_PASSWORD:?Set NPM_MYSQL_ROOT_PASSWORD in infra/docker/.env}
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: ${NPM_MYSQL_PASSWORD:?Set NPM_MYSQL_PASSWORD in infra/docker/.env}
    volumes:
      - npm-db-data:/var/lib/mysql

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.12.3
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NPM_MYSQL_PASSWORD:?Set NPM_MYSQL_PASSWORD in infra/docker/.env}
      DB_MYSQL_NAME: npm
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - npm-db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: operationhub
      POSTGRES_USER: operationhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operationhub -d operationhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm --workspace @operationhub/api run seed && npm --workspace @operationhub/api run dev"
    environment:
      DATABASE_URL: postgres://operationhub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env}@db:5432/operationhub
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infra/docker/.env (openssl rand -base64 48)}
      APP_URL: ${APP_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_WORKER_PASSWORD: ${SEED_WORKER_PASSWORD:-}
      DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-localhost}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "5000:5000"
    volumes:
      - ../..:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm --workspace @operationhub/web run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    volumes:
      - ../..:/app
    depends_on:
      - api

  web-static:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ../../apps/web/dist:/usr/share/nginx/html:ro
      - ../nginx/web-static.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - postgres-exporter
      - cadvisor
      - node-exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://operationhub:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/docker/.env}@db:5432/operationhub?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    privileged: true
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infra/docker/.env}
    volumes:
      - ../observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ../observability/alerting:/etc/grafana/provisioning/alerting:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  npm-db-data:
  npm-data:
  npm-letsencrypt:
